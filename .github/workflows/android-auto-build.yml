name: Android Auto Build

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build even when upstream/main did not change"
        type: boolean
        default: true
      publish_release:
        description: "Publish the APK to the android-latest GitHub Release"
        type: boolean
        default: true
      package_id:
        description: "Android applicationId for the private fork build"
        type: string
        default: "ai.multica.mobile.eiei114"
  schedule:
    # 06:15 JST. GitHub may delay scheduled workflows by several minutes.
    - cron: "15 21 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: android-auto-build
  cancel-in-progress: true

jobs:
  sync:
    name: Sync upstream/main into android-build
    if: github.repository == 'eiei114/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      mobile_changed: ${{ steps.sync.outputs.mobile_changed }}
      head_sha: ${{ steps.sync.outputs.head_sha }}
      short_sha: ${{ steps.sync.outputs.short_sha }}
    steps:
      - name: Checkout android-build
        uses: actions/checkout@v6
        with:
          ref: android-build
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/multica-ai/multica.git || true
          git fetch upstream main

          before="$(git rev-parse HEAD)"
          if git merge --no-edit upstream/main; then
            after="$(git rev-parse HEAD)"
            changed=false
            mobile_changed=false

            if [ "$before" != "$after" ]; then
              changed=true
              if git diff --name-only "$before" "$after" | grep -E '^(apps/mobile/|packages/core/|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|scripts/build-android|\.github/workflows/android-auto-build\.yml)' >/dev/null; then
                mobile_changed=true
              fi
              git push origin HEAD:android-build
            fi

            echo "changed=$changed" >> "$GITHUB_OUTPUT"
            echo "mobile_changed=$mobile_changed" >> "$GITHUB_OUTPUT"
            echo "head_sha=$after" >> "$GITHUB_OUTPUT"
            echo "short_sha=${after:0:12}" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream merge conflict. Resolve locally with: git fetch upstream && git merge upstream/main" >&2
            git status --short >&2 || true
            exit 1
          fi

  build:
    name: Build production Android APK
    needs: sync
    if: >-
      github.repository == 'eiei114/multica' &&
      (needs.sync.outputs.mobile_changed == 'true' || github.event_name == 'workflow_dispatch' && inputs.force_build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: production
      EXPO_ANDROID_PACKAGE_PROD: ${{ inputs.package_id || 'ai.multica.mobile.eiei114' }}
      EXPO_BUNDLE_IDENTIFIER_PROD: ai.multica.mobile.eiei114
      EXPO_ANDROID_UPDATE_REPO: eiei114/multica
      EXPO_ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_APP_VERSION: 0.1.0-android.${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout android-build
        uses: actions/checkout@v6
        with:
          ref: android-build
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Expo cache
        uses: actions/cache@v4
        with:
          path: ~/.expo
          key: expo-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            expo-${{ runner.os }}-

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/multica-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: bash scripts/build-android-release.sh

      - name: Stage APK and update metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="artifacts/android"
          mkdir -p "$artifact_dir"

          apk_source="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          apk_name="multica-android-latest.apk"
          apk_dest="$artifact_dir/$apk_name"
          metadata_path="$artifact_dir/android-update.json"
          cp "$apk_source" "$apk_dest"

          node - <<'NODE'
          const fs = require('fs');
          const metadata = {
            versionCode: Number(process.env.GITHUB_RUN_NUMBER),
            versionName: `0.1.0-android.${process.env.GITHUB_RUN_NUMBER}`,
            packageId: process.env.EXPO_ANDROID_PACKAGE_PROD,
            commit: process.env.HEAD_SHA,
            branch: 'android-build',
            builtAt: new Date().toISOString(),
            apk: 'multica-android-latest.apk',
          };
          fs.writeFileSync('artifacts/android/android-update.json', JSON.stringify(metadata, null, 2));
          NODE
        env:
          HEAD_SHA: ${{ needs.sync.outputs.head_sha }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: multica-android-${{ github.run_number }}
          path: artifacts/android/*
          retention-days: 30

      - name: Publish android-latest GitHub Release
        if: github.event_name == 'schedule' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete android-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create android-latest \
            artifacts/android/multica-android-latest.apk \
            artifacts/android/android-update.json \
            --repo "${{ github.repository }}" \
            --target android-build \
            --latest \
            --title "Android APK latest" \
            --notes "Automated private Android APK build from android-build at ${{ needs.sync.outputs.short_sha }}."
